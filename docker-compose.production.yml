name: dotcom

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procura}
      POSTGRES_USER: ${POSTGRES_USER:-procura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-vector-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env.production}
    container_name: frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr:
    image: ${OCR_IMAGE:?Set OCR_IMAGE in .env.production}
    container_name: ocr
    env_file:
      - .env.production
    volumes:
      - ocr-models:/opt/ocr-models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.production}
    container_name: backend
    env_file:
      - .env.production
    environment:
      OCR_SERVICE_BASE_URL: http://ocr:8080
      REDIS_URL: redis://redis:6379/0
      PERSISTENCE_BACKEND: postgresql
      STORAGE_PROVIDER: filesystem
      UPLOAD_DIR: /app/data/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:-procura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-procura}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  app-data:
  postgres-vector-data:
  ocr-models:
